name = "stormsearch-apollo-proxy"
main = "src/index.js"
compatibility_date = "2026-04-25"

# Firm Cloudflare account (jyurk) since 2026-10-23. Before that the proxy lived on Nick's
# personal account (n-alioto7.workers.dev), which this machine has no deploy credentials for.
# Public URL: https://stormsearch-apollo-proxy.jyurk.workers.dev
account_id = "44352d119e27f338ca2eda18ef410e7c"

# Usage log: one row per proxied Apollo call (src/index.js, src/usage-log.js), shared with worker-images. Schema in
# migrations/; apply with ./node_modules/.bin/wrangler d1 migrations apply apollo-addin-calls --remote
[[d1_databases]]
binding = "CALL_LOG"
database_name = "apollo-addin-calls"
database_id = "5ceea248-cf11-4a52-bf37-3dfd7dded62b"
migrations_dir = "migrations"

# Usage log (2026-11-08): the Worker version on every row, and one Analytics Engine point per log
# write so lost writes show without D1 (docs/RUNBOOK_USAGE_LOG.md). Both Workers share the dataset.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[analytics_engine_datasets]]
binding = "USAGE_HEALTH"
dataset = "apollo_addin_usage_health"

# Workers Logs stays off: it records request headers, and every call carries an Apollo key.
[observability]
enabled = false
